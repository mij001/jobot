# ---------------------------------------------------------------------------
#  jobot – Sri Lankan EEE job hunter: configuration
#
#  Edit this file (on GitHub you can click the pencil icon) to change what the
#  bot looks for. Changes take effect on the next daily run.
#
#  Keyword rules (used everywhere below):
#    * case-insensitive, whole words / phrases:  "plc" will NOT match "replica"
#    * a trailing * is a wildcard:               "electric*" matches electrical,
#                                                electricity, electrician ...
# ---------------------------------------------------------------------------

# ===========================================================================
