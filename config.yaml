# Job titles containing any of these are always dropped (whole words/phrases).
# Handy for removing noise, e.g. add "technician" and "electrician" if you only
# want engineer-level roles.
exclude_title_keywords:
  - quantity surveyor
  - welder
  - driver
  - helper
  - labourer
  - security guard
  - accountant
  - call center
  - call centre
  - devops
  - technician
  # - technician
  # - electrician

  # Matching on the job title is always on. Descriptions / site categories are
  # noisier, so a job that only mentions your keywords in its description (e.g.
  # a plain "Assistant Engineer" ad) is kept only if
  #   * its title contains one of `description_match_titles`, and
  #   * the description has at least `min_description_hits` DIFFERENT keywords.
match_description: true
min_description_hits: 2
description_match_titles:
  - engineer*
  - engineering
  - technical officer*
  - technician*
  - technologist*
  - trainee*
  - intern
  - interns
  - internship*
  - graduate*
  - draughtsman
  - draftsman

# Only keep jobs whose location contains one of these (empty = anywhere).
# e.g. [Colombo, Gampaha, Kandy, Remote]
locations: []

# Sri Lankan sites also carry many overseas jobs (Gulf, Maldives ...).
# Set to false to skip ads that mention one of `overseas_keywords` in the
# title or location.
include_overseas: true
overseas_keywords:
  - foreign job
  - overseas
  - abroad
  - Kuwait
  - Dubai
  - Abu Dhabi
  - UAE
  - United Arab Emirates
  - Qatar
  - Saudi*
  - KSA
  - Oman
  - Bahrain
  - Maldives
  - Singapore
  - Malaysia
  - Japan
  - Korea
  - Australia
  - New Zealand
  - Canada
  - United Kingdom
  - Poland
  - Romania
  - Israel

# ===========================================================================
#  2. EXPERIENCE LEVELS
#  Levels are listed from most junior to most senior.
#  Each job is assigned ONE level, using (in order):
#    a) keywords in the job title – if several levels match, the most senior
#       one wins (e.g. "Trainee Engineer" -> entry, "Senior Manager" -> management)
#    b) "X years of experience" found in the title/description, mapped with
#       min_years / max_years
#    c) the level the job site itself shows (XpressJobs, Rooster, ikman)
#  Only jobs in ENABLED levels are reported.
# ===========================================================================
experience_levels:
  internship:
    enabled: true
    label: Internship / Trainee
    keywords:
      - intern
      - interns
      - internship*
      - trainee
      - undergraduate*
      - apprentice*
      - industrial training
      - industrial placement

  entry:
    enabled: true
    label: Entry level / Fresh graduate
    min_years: 0
    max_years: 1
    keywords:
      - junior*
      - jr
      - graduate
      - associate*
      - fresh graduate*
      - freshers
      - entry level
      - trainee engineer*
      - engineer trainee
      - graduate trainee*
      - management trainee*
      - engineering trainee*
      - assistant engineer*
      - associate engineer*
      - graduate engineer*

  mid:
    enabled: true
    label: Mid level
    min_years: 2
    max_years: 4
    keywords:
      - mid level
      - engineer ii

  senior:
    enabled: false
    label: Senior
    min_years: 5
    max_years: 9
    keywords:
      - senior*
      - sr
      - lead
      - principal
      - engineer iii

  management:
    enabled: false
    label: Manager / Head
    min_years: 10
    keywords:
      - manager
      - head of
      - director
      - general manager
      - deputy general manager
      - DGM
      - AGM
      - chief

# Many ads don't say what level they are. Keep those?
include_unknown_level: true

# ===========================================================================
#  3. JOB SITES
# ===========================================================================
sources:
  topjobs:
    enabled: true
    # topjobs.lk "functional area" codes to scan:
    #   MAE Eng-Mech/Auto/Elec   ITT IT-Telecoms   HNS IT-Hardware/Networks
    #   RLT R&D/Science          POS Manufacturing/Operations
    #   SQC Supervision/Quality Control
    categories: [MAE, ITT, HNS, RLT, POS, SQC]

  xpressjobs:
    enabled: true
    # XpressJobs refuses connections from cloud servers (including GitHub
    # Actions), so the daily run skips it. It still works when you run
    # jobot on your own computer. Tip: turn on XpressJobs' own free job
    # alerts for the Electronics/Electrical sector to cover it.
    skip_on_github_actions: true
    # XpressJobs sector ids:
    #   24 Electronics/Electrical   25 Engineering/Manufacturing
    #   132 Technical/Mechanical    50 Telecommunications
    #   139 IT-Hardware/Networks/Systems
    sectors: [24, 25, 132, 50, 139]
    max_pages: 10 # 100 jobs per page
    # How XpressJobs' own "career level" maps to the levels above.
    career_levels:
      1: entry # Entry Level
      2: mid # Associate
      3: mid # Mid-Senior Level
      4: senior # Senior
      5: management # Executive
      6: management # Director

  ikman:
    enabled: true
    categories:
      - engineer-jobs
      - technician-jobs
      - internships-and-trainees-jobs
      - it-and-network-industry-jobs
    max_pages: 4 # 25 ads per page

  rooster:
    enabled: true
    country: Sri Lanka
    queries: [electrical, electronic, engineer, engineering, automation, embedded, telecommunication, solar, intern]
    max_pages: 3 # 100 jobs per page, per query

  observerjobs:
    enabled: true
    # Observer Jobs (Lake House) – lots of government/state vacancies. Like
    # XpressJobs it refuses GitHub's servers, so the daily run skips it;
    # Gazette.lk (RSS below) carries most of the same government notices.
    skip_on_github_actions: true
    max_pages: 10 # 15 jobs per page; usually 4-5 pages in total

  lankajobs:
    enabled: true
    # LankaJobs – government, private and foreign jobs, newest first.
    max_pages: 8 # 24 jobs per page

  rss:
    enabled: true
    # Any RSS/Atom feed of job adverts. WordPress job blogs have one at /feed.
    feeds:
      - url: https://www.gazette.lk/feed
        name: Gazette.lk
        pages: 5

  company_pages:
    enabled: true
    # Employers' own careers pages. Every link that looks like a vacancy is
    # picked up. `subfield` tags everything found on that page (handy when a
    # link only says "Technician"); leave it out to use normal matching.
    delay_seconds: 5
    pages:
      - url: https://www.ceb.lk/careers/en
        name: CEB
        company: Ceylon Electricity Board
        subfield: power
      - url: https://careers.slt.lk/
        name: SLT-Mobitel
        company: SLT-Mobitel
        subfield: telecom

  linkedin:
    enabled: true
    location: Sri Lanka
    keywords:
      - electrical engineer
      - electronics engineer
      - electrical and electronic engineering
      - power engineer
      - embedded engineer
      - automation engineer
      - telecommunication engineer
      - solar engineer
      - electrical engineering intern
    posted_within_days: 7
    max_pages: 1 # 10 jobs per page, per keyword
    # LinkedIn limits anonymous searches, so go slowly and, when it says
    # "too many requests", wait once before trying again.
    delay_seconds: 6
    retry_wait_seconds: 60
    # LinkedIn's own experience filter is applied from your enabled levels
    # above. LinkedIn codes: 1 Internship, 2 Entry, 3 Associate,
    # 4 Mid-Senior, 5 Director, 6 Executive
    experience_codes:
      internship: [1]
      entry: [2, 3]
      mid: [3, 4]
      senior: [4]
      management: [5, 6]

# ===========================================================================
#  4. AI REVIEWER (optional, free)
#  After the keyword filter, a free AI model reads each NEW job and scores
#  how well it fits the profile below (0-10), adds a one-line reason, fills in
#  experience levels the keywords missed, and hides jobs scoring under
#  `min_score`. Needs a free API key in the AI_API_KEY secret (see README):
#    gemini – Google AI Studio key (free tier, Flash models)
#    groq   – console.groq.com key (free tier)
#  Without a key this step is skipped and you get the keyword results.
# ===========================================================================
ai:
  enabled: true
  provider: gemini
  # Models to try, in order (blank = good free defaults for the provider).
  models: []
  profile: |
    Electrical & Electronic Engineering (EEE) graduate in Sri Lanka looking for
    engineering jobs in power, electronics, automation, telecom and related
    fields. Prefer engineer / trainee-engineer roles over technician, sales or
    admin roles. Open to internships and entry- to mid-level positions.
  min_score: 4
  batch_size: 20 # jobs per AI request
  requests_per_minute: 8 # stay under the free-tier limit

# ===========================================================================
#  5. NOTIFICATIONS
#  Channels turn on automatically when their secrets are set
#  (see README: TELEGRAM_BOT_TOKEN + TELEGRAM_CHAT_ID, and/or SMTP_* + EMAIL_TO).
# ===========================================================================
notify:
  # Send a short "no new jobs today" message so you know the bot ran.
  send_when_empty: true
  # Forget a vacancy after this many days (a re-post after that is re-sent).
  remember_days: 60
  # How jobs are arranged in each message.
  #   order_by: best_match | newest | closing_soon | company | title
  #     (best_match = highest AI score first, then newest)
  #   group_by: level | subfield | site | none
  order_by: best_match
  group_by: level
