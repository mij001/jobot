# Job titles containing any of these are always dropped (whole words/phrases).
# Handy for removing noise, e.g. add "technician" and "electrician" if you only
# want engineer-level roles.
exclude_title_keywords:
  - quantity surveyor
  - welder
  - driver
  - helper
  - labourer
  - security guard
  - accountant
  - call center
  - call centre
  - devops
  - technician
  # - technician
  # - electrician

  # Matching on the job title is always on. Descriptions / site categories are
  # noisier, so a job that only mentions your keywords in its description (e.g.
  # a plain "Assistant Engineer" ad) is kept only if
  #   * its title contains one of `description_match_titles`, and
  #   * the description has at least `min_description_hits` DIFFERENT keywords.
match_description: true
min_description_hits: 2
description_match_titles:
  - engineer*
  - engineering
  - technical officer*
  - technician*
  - technologist*
  - trainee*
  - intern
  - interns
  - internship*
  - graduate*
  - draughtsman
  - draftsman

# Only keep jobs whose location contains one of these (empty = anywhere).
# e.g. [Colombo, Gampaha, Kandy, Remote]
locations: []

# Employers you care about. Jobs from a WATCHED company are marked 👀 and move up
# one importance tier; jobs from an AVOIDED company are never sent. Company
# names follow the keyword rules above (whole words, * wildcard): e.g.
#   watch_companies: [CEB, "Ceylon Electricity Board", Dialog, "SLT*"]
watch_companies: []
avoid_companies: []

# Sri Lankan sites also carry many overseas jobs (Gulf, Maldives ...).
# Set to false to skip ads that mention one of `overseas_keywords` in the
# title or location.
include_overseas: true
overseas_keywords:
  - foreign job
  - overseas
  - abroad
  - Kuwait
  - Dubai
  - Abu Dhabi
  - UAE
  - United Arab Emirates
  - Qatar
  - Saudi*
  - KSA
  - Oman
  - Bahrain
  - Maldives
  - Singapore
  - Malaysia
  - Japan
  - Korea
  - Australia
  - New Zealand
  - Canada
  - United Kingdom
  - Poland
  - Romania
  - Israel

# ===========================================================================
#  2. EXPERIENCE LEVELS
#  Levels are listed from most junior to most senior.
#  Each job is assigned ONE level, using (in order):
#    a) keywords in the job title – if several levels match, the most senior
#       one wins (e.g. "Trainee Engineer" -> entry, "Senior Manager" -> management)
#    b) "X years of experience" found in the title/description, mapped with
#       min_years / max_years
#    c) the level the job site itself shows (XpressJobs, Rooster, ikman)
#  Only jobs in ENABLED levels are reported.
# ===========================================================================
experience_levels:
  internship:
    enabled: true
    label: Internship / Trainee
    keywords:
      - intern
      - interns
      - internship*
      - trainee
      - undergraduate*
      - apprentice*
      - industrial training
      - industrial placement

  entry:
    enabled: true
    label: Entry level / Fresh graduate
    min_years: 0
    max_years: 1
    keywords:
      - junior*
      - jr
      - graduate
      - associate*
      - fresh graduate*
      - freshers
      - entry level
      - trainee engineer*
      - engineer trainee
      - graduate trainee*
      - management trainee*
      - engineering trainee*
      - assistant engineer*
      - associate engineer*
      - graduate engineer*

  mid:
    enabled: true
    label: Mid level
    min_years: 2
    max_years: 4
    keywords:
      - mid level
      - engineer ii

  senior:
    enabled: false
    label: Senior
    min_years: 5
    max_years: 9
    keywords:
      - senior*
      - sr
      - lead
      - principal
      - engineer iii

  management:
    enabled: false
    label: Manager / Head
    min_years: 10
    keywords:
      - manager
      - head of
      - director
      - general manager
      - deputy general manager
      - DGM
      - AGM
      - chief

# Many ads don't say what level they are. Keep those?
include_unknown_level: true

# ===========================================================================
#  3. QUALIFICATION (degree / diploma)
#  jobot reads each advert – text, poster image or PDF – and notes which
#  qualifications it accepts. A job is reported if it accepts at least one
#  ENABLED qualification, so "BSc or HND in Electrical Engineering" still
#  shows up for a degree holder, while HND/NDT-only adverts don't.
#  `title_hints` are used only when the advert itself doesn't say (e.g. a
#  "Technical Officer" poster that couldn't be read is almost always diploma
#  level). NVQ levels are recognised however they're written
#  ("NVQ L5", "NVQ Level 05", "NVQ 5/6").
# ===========================================================================
qualifications:
  degree:
    enabled: true
    label: Degree (BSc / BEng / NVQ 7)
    keywords:
      - degree
      - degrees
      - bachelor*
      - bsc*
      - b.sc*
      - b. sc*
      - beng
      - b.eng*
      - btech
      - b.tech*
      - graduate*
      - undergraduate*
      - postgraduate*
      - msc
      - m.sc*
      - meng
      - chartered engineer*
      - ceng
      - amie*
      - nvq level 7

  diploma:
    enabled: false
    label: Diploma (HND / NDT / NVQ 5–6)
    keywords:
      - diploma*
      - hnd*
      - hndip*
      - hnde
      - ndt
      - ndes
      - national diploma*
      - higher national*
      - nvq level 5
      - nvq level 6
    title_hints:
      - technical officer*
      - engineering assistant*
      - technical assistant*
      - draughtsman
      - draftsman
      - supervisor*

  vocational:
    enabled: false
    label: Vocational (NVQ 3–4 / trade certificate)
    keywords:
      - nvq level 1
      - nvq level 2
      - nvq level 3
      - nvq level 4
      - trade test*
      - trade certificate*
      - national certificate*
      - city & guilds
      - city and guilds
      - vocational
      - craftsman
    title_hints:
      - technician*
      - electrician*
      - wireman
      - wiremen
      - fitter*
      - mechanic*
      - operator*
      - lineman
      - linemen

  school:
    enabled: false
    label: School (O/L or A/L only)
    keywords:
      - o/l
      - a/l
      - g.c.e*
      - gce
      - ordinary level
      - advanced level

# Adverts that don't say (or couldn't be read). Keep those?
include_unknown_qualification: true

# ===========================================================================
#  HOW OFTEN, AND HOW HARD
#  The workflow wakes up every 30 minutes (the `cron:` line in
#  .github/workflows/daily.yml). Every run reads all the sites below at the
#  same time. The first run after `digest_hour` (Sri Lanka time) sends the
#  daily summary; the runs in between only message you when they find
#  something new, and skip sites marked `every_hours:` until they are due.
# ===========================================================================
schedule:
  digest_hour: 8
  # Sites read at the same time.
  workers: 6
  # A site that hasn't finished after this many seconds is given up on for this run;
  # the whole read of all sites (second chances included) is cut off after run_seconds.
  site_seconds: 240
  run_seconds: 540
  retry_seconds: 90
  # Ask a site that timed out or errored once more before giving up on it.
  retry_failed: true

# ===========================================================================
#  4. JOB SITES
#  Any site can have several entries: give an entry `type:` (the site's own
#  name below), a `name:` and `every_hours:` – e.g. a fast entry for the pages
#  that change all day and a slower one for the long tail.
#  Entries that need a secret (`jooble`) or your mailbox (`email_alerts`) are
#  switched on but say "skipped" in the report until you set them up (README).
# ===========================================================================
sources:
  topjobs:
    enabled: true
    # topjobs.lk "functional area" codes to scan:
    #   MAE Eng-Mech/Auto/Elec   ITT IT-Telecoms   HNS IT-Hardware/Networks
    #   RLT R&D/Science          POS Manufacturing/Operations
    #   SQC Supervision/Quality Control
    #   MAE Eng-Mech/Auto/Elec   ITT IT-Telecoms   HNS IT-Hardware/Networks
    categories: [MAE, ITT, HNS]
    # topjobs' pages are huge (hundreds of KB) and slow to answer from GitHub, so
    # they get a patient timeout and are read two at a time.
    timeout_seconds: 60
    retries: 0
    workers: 2

  # The other topjobs areas, every couple of hours. Several of them hold EEE work
  # that the three above don't:
  #   RLT R&D/Science   POS Manufacturing/Operations   SQC Supervision/Quality Control
  #   CCE Civil/Interior/Architecture (building services, MEP)   AIM Airline/Marine
  #   TAL Education (lecturers, instructors)   SMM Sales/Marketing (technical sales)
  #   MHN Medical (biomedical)   SDQ IT-Software/DB/QA/Web/GIS   AGD Agriculture/Environment
  #   IDV International Development   COM Corporate Management   LWT Logistics/Transport
  topjobs_more:
    type: topjobs
    name: topjobs.lk (other areas)
    enabled: true
    every_hours: 2
    categories: [RLT, POS, SQC, CCE, AIM, TAL, SMM, MHN, SDQ, AGD, IDV, COM, LWT]
    timeout_seconds: 60
    retries: 0
    workers: 2
    site_seconds: 420

  xpressjobs:
    enabled: true
    # XpressJobs refuses connections from cloud servers (including GitHub
    # Actions), so the daily run skips it. It still works when you run
    # jobot on your own computer. Tip: turn on XpressJobs' own free job
    # alerts for the Electronics/Electrical sector to cover it.
    skip_on_github_actions: true
    # XpressJobs sector ids:
    #   24 Electronics/Electrical   25 Engineering/Manufacturing
    #   132 Technical/Mechanical    50 Telecommunications
    #   139 IT-Hardware/Networks/Systems
    sectors: [24, 25, 132, 50, 139]
    max_pages: 10 # 100 jobs per page
    # How XpressJobs' own "career level" maps to the levels above.
    career_levels:
      1: entry # Entry Level
      2: mid # Associate
      3: mid # Mid-Senior Level
      4: senior # Senior
      5: management # Executive
      6: management # Director

  ikman:
    enabled: true
    categories:
      - engineer-jobs
      - technician-jobs
      - internships-and-trainees-jobs
      - it-and-network-industry-jobs
      - draftsman-jobs
    max_pages: 4 # 25 ads per page (the daily run reads all of them)
    quick_pages: 1 # the runs in between only need the newest page of each category

  # More ikman job categories, every couple of hours.
  ikman_more:
    type: ikman
    name: ikman.lk (more categories)
    enabled: true
    every_hours: 2
    quick_pages: 1
    categories:
      - building-construction-jobs
      - factory-and-manufacturing-jobs
      - production-and-operations-jobs
      - supervisor-jobs
      - education-and-training-jobs
      - consultant-jobs
    max_pages: 3

  # ikman's own keyword search across ALL job ads: finds the ones filed in the
  # wrong category.
  ikman_search:
    type: ikman
    name: ikman.lk (searches)
    enabled: true
    every_hours: 2
    categories: []
    quick_query_pages: 1
    queries:
      - electrical engineer
      - electronic engineer
      - engineer
      - technical officer
      - electrical
      - electronic
      - solar
      - automation
      - PLC
      - telecommunication
      - network engineer
      - maintenance engineer
      - site engineer
      - project engineer
      - instrumentation
      - mechatronic
      - CCTV
      - service engineer
      - commissioning
      - lecturer
    query_pages: 2

  rooster:
    enabled: true
    country: Sri Lanka
    queries: [electrical, electronic, engineer, engineering, automation, embedded, telecommunication, solar, intern]
    max_pages: 3 # 100 jobs per page, per query
    quick_pages: 1

  # A longer list of searches, hourly.
  rooster_more:
    type: rooster
    name: Rooster (more searches)
    enabled: true
    every_hours: 1
    country: Sri Lanka
    queries:
      - power
      - PLC
      - SCADA
      - maintenance engineer
      - instrumentation
      - project engineer
      - site engineer
      - service engineer
      - technical officer
      - biomedical
      - mechatronics
      - IoT
      - network engineer
      - substation
      - HVAC
      - building services
      - lecturer
      - quality engineer
      - commissioning
      - graduate engineer
      - trainee engineer
      - research assistant
    max_pages: 2
    quick_pages: 1

  observerjobs:
    enabled: true
    # Observer Jobs (Lake House) – lots of government/state vacancies. Like
    # XpressJobs it refuses GitHub's servers, so the daily run skips it;
    # Gazette.lk (RSS below) carries most of the same government notices.
    skip_on_github_actions: true
    max_pages: 10 # 15 jobs per page; usually 4-5 pages in total

  lankajobs:
    enabled: true
    # LankaJobs – government, private and foreign jobs, newest first.
    max_pages: 8 # 24 jobs per page
    quick_pages: 2

  itpro:
    enabled: true
    # ITPro.lk – IT job board; these pages carry embedded, IoT, hardware and
    # network roles. "" = the latest jobs of every category.
    categories: ["", hardware-networking, internship]

  techjobs:
    enabled: true
    # TechJobs.lk – engineering/technical vacancies (latest on its homepage).
    max_pages: 3

  rss:
    enabled: true
    # Any RSS/Atom feed of job adverts. WordPress job blogs have one at /feed.
    feeds:
      - url: https://www.gazette.lk/feed
        name: Gazette.lk
        pages: 5
      - name: FindMyJob.lk
        url: https://findmyjob.lk/jobs/feed/
        pages: 5

  company_pages:
    enabled: true
    # Employers' own careers pages. Every link that looks like a vacancy is
    # picked up. `subfield` tags everything found on that page (handy when a
    # link only says "Technician"); leave it out to use normal matching.
    delay_seconds: 5
    pages:
      - url: https://www.ceb.lk/careers/en
        name: CEB
        company: Ceylon Electricity Board
        subfield: power
      - url: https://careers.slt.lk/
        name: SLT-Mobitel
        company: SLT-Mobitel
        subfield: telecom

  # Fully remote jobs open to people in Sri Lanka (see the note under the sources). Ten free boards, read together:
  # Remote OK, We Work Remotely, Jobicy, Himalayas, Working Nomads, Jobspresso, NoDesk, the monthly "Who is hiring"
  # thread on Hacker News, and the career pages of a few hardware employers (Remotive has its own entry below).
  # Most remote adverts are limited to certain countries: jobot keeps the ones that say "worldwide" / "Asia" /
  # nothing, and the AI reads the rest of the advert to decide (see the ai: section).
  remote_jobs:
    enabled: true
    every_hours: 3
    providers: [remoteok, weworkremotely, jobicy, himalayas, workingnomads, jobspresso, nodesk, hn_hiring, boards]
    # Extra words in a job's "who can apply" text that should count as open to you (e.g. "south asia").
    open_to: []
    queries: [embedded, firmware, electrical engineer, electronics engineer, hardware engineer, PCB, FPGA, power systems,
              controls engineer, automation engineer, IoT, RF engineer, telecommunications, network engineer, solar,
              test engineer, mechatronics, robotics]
    # Remote OK category tags to read.
    remoteok_tags: [hardware, electronics, embedded, iot, robotics, firmware, electrical, engineering, devops, networking]
    # Employers' own job boards (Greenhouse / Lever / Ashby); only their remote jobs are used. To add one, find the
    # name in the address of its careers page (jobs.lever.co/NAME, boards.greenhouse.io/NAME, jobs.ashbyhq.com/NAME).
    boards:
      - {ats: ashby, slug: cerebras, name: Cerebras}
      - {ats: ashby, slug: quilter, name: Quilter}
      - {ats: ashby, slug: skydio, name: Skydio}
      - {ats: ashby, slug: span, name: Span}
      - {ats: ashby, slug: wayve, name: Wayve}
      - {ats: greenhouse, slug: chargepoint, name: ChargePoint}
      - {ats: greenhouse, slug: samsara, name: Samsara}
      - {ats: greenhouse, slug: oura, name: Oura}
      - {ats: lever, slug: rigetti, name: Rigetti}
      - {ats: lever, slug: voltus, name: Voltus}

  # Remotive asks API users to call about 4 times a day, so it gets its own, slower entry.
  remotive:
    type: remote_jobs
    name: Remotive
    enabled: true
    every_hours: 12
    providers: [remotive]

  # LinkedIn's own "remote" filter, for jobs listed in Sri Lanka.
  linkedin_remote:
    type: linkedin
    name: LinkedIn (remote)
    enabled: true
    every_hours: 6
    remote: true
    location: Sri Lanka
    keywords: [embedded engineer, firmware engineer, hardware engineer, electrical engineer, electronics engineer,
               automation engineer, network engineer, power systems engineer, engineer]
    posted_within_days: 14
    delay_seconds: 6
    retry_wait_seconds: 60

  # University and institute vacancy pages (lecturer, instructor, technical
  # officer and research posts) – found with `python -m jobot --probe`, which
  # tries addresses from GitHub's own servers. Add more the same way.
  university_pages:
    type: company_pages
    name: University vacancies
    enabled: true
    every_hours: 3
    delay_seconds: 2
    pages:
      - {url: "https://uom.lk/vacancies", name: "Univ. of Moratuwa", company: "University of Moratuwa"}
      - {url: "https://eng.jfn.ac.lk/", name: "Eng. Faculty, Jaffna", company: "University of Jaffna"}
      - {url: "https://eng.pdn.ac.lk/", name: "Eng. Faculty, Peradeniya", company: "University of Peradeniya"}
      - {url: "https://cmb.ac.lk/vacancies/", name: "Univ. of Colombo", company: "University of Colombo"}
      - {url: "https://www.sjp.ac.lk/vacancies/", name: "Univ. of Sri Jayewardenepura", company: "University of Sri Jayewardenepura"}
      - {url: "https://www.ou.ac.lk/home/index.php/vacancies", name: "Open University", company: "Open University of Sri Lanka"}
      - {url: "https://www.sab.ac.lk/vacancies", name: "Sabaragamuwa Univ.", company: "Sabaragamuwa University"}
      - {url: "https://www.wyb.ac.lk/vacancies", name: "Wayamba Univ.", company: "Wayamba University"}
      - {url: "https://www.rjt.ac.lk/vacancies", name: "Rajarata Univ.", company: "Rajarata University"}
      - {url: "https://www.vau.ac.lk/", name: "Univ. of Vavuniya", company: "University of Vavuniya"}
      - {url: "https://www.esn.ac.lk/", name: "Eastern Univ.", company: "Eastern University"}
      - {url: "https://www.jfn.ac.lk/index.php/vacancies/", name: "Univ. of Jaffna", company: "University of Jaffna"}

  # Job-alert e-mails that sites send you (XpressJobs, LinkedIn, Rooster, Jobsnet,
  # Indeed …). It reads your mailbox READ-ONLY over IMAP – only messages from the
  # senders you list, nothing is marked read, moved or deleted. Subscribe to the
  # alerts on each site first. Needs the IMAP_USERNAME / IMAP_PASSWORD secrets (or
  # it reuses SMTP_USERNAME / SMTP_PASSWORD; a Gmail app password works for both).
  # Switched on, but it only says "skipped" until the mailbox can be logged in to.
  # Alerts in a layout jobot doesn't know are read by the AI (once each).
  email_alerts:
    enabled: true
    host: imap.gmail.com
    folder: INBOX
    days: 3
    max_messages: 60
    senders: [xpress.jobs, linkedin.com, rooster.jobs, jobsnet.lk, indeed.com, topjobs.lk, careerjet, jooble.org]

  # Jooble gathers adverts from many sites; its free API needs a key (jooble.org/api/about)
  # stored as the JOOBLE_API_KEY secret. Switched on, but skipped until the key is there.
  jooble:
    enabled: true
    location: Sri Lanka
    queries: [electrical engineer, electronic engineer, automation engineer, telecommunication engineer, solar engineer, maintenance engineer]
    max_pages: 2

  linkedin:
    enabled: true
    location: Sri Lanka
    # LinkedIn limits anonymous searches, so it is only asked every few hours.
    every_hours: 3
    keywords:
      - electrical engineer
      - electronics engineer
      - electrical and electronic engineering
      - power engineer
      - power systems engineer
      - embedded engineer
      - automation engineer
      - instrumentation engineer
      - PLC engineer
      - maintenance engineer
      - telecommunication engineer
      - network engineer
      - solar engineer
      - site engineer electrical
      - commissioning engineer
      - biomedical engineer
      - graduate engineer
      - trainee engineer
      - electrical engineering intern
      - engineering intern
    posted_within_days: 7
    max_pages: 1 # 10 jobs per page, per keyword
    # LinkedIn limits anonymous searches, so go slowly and, when it says
    # "too many requests", wait once before trying again.
    delay_seconds: 6
    retry_wait_seconds: 60
    # LinkedIn's own experience filter is applied from your enabled levels
    # above. LinkedIn codes: 1 Internship, 2 Entry, 3 Associate,
    # 4 Mid-Senior, 5 Director, 6 Executive
    experience_codes:
      internship: [1]
      entry: [2, 3]
      mid: [3, 4]
      senior: [4]
      management: [5, 6]

# ===========================================================================
#  5. READING THE ADVERTS
#  Job lists often show only a title, and many adverts are a poster image or
#  a PDF. jobot opens each promising NEW job's own page, reads its text,
#  reads posters with OCR (free Tesseract, installed by the workflow) and
#  PDFs, and uses that for the sub-field, experience and qualification
#  checks above. Each advert is read once (remembered in
#  data/postings_cache.json).
# ===========================================================================
postings:
  enabled: true
  # Most new pages opened per run; the rest wait for the next run. They are opened
  # `workers` at a time (reading a poster with OCR takes ~15 s) and never for longer
  # than `max_seconds` in all, so a run stays quick even right after new sites were added.
  max_per_run: 60
  workers: 4
  max_seconds: 240
  # Read the text out of poster images with OCR.
  read_posters: true
  # When OCR can't make sense of a poster, let the AI read it (Gemini only;
  # uses your free AI quota) – at most max_ai_reads posters per run.
  ai_vision: true
  max_ai_reads: 5
  # Jobs whose list entry is too thin to judge are opened too when their
  # title contains one of `description_match_titles` – except titles with
  # one of these (other fields).
  skip_titles:
    - civil
    - mechanical
    - software
    - chemical
    - structural
    - quantity surveyor*
    - textile*
    - food
    - automobile
    - automotive
    - garment*
    - apparel
    - accounting
    - sales
    - marketing
    - merchandis*
    - plumbing

# ===========================================================================
#  6. AI REVIEWER (optional, free)
#  After the keyword filter, a free AI model reads each NEW job and scores
#  how well it fits the profile below (0-10), adds a one-line reason, fills in
#  experience levels the keywords missed, and hides jobs scoring under
#  `min_score`. Needs a free API key in the AI_API_KEY secret (see README):
#    gemini – Google AI Studio key (free tier, Flash models)
#    groq   – console.groq.com key (free tier)
#  Without a key this step is skipped and you get the keyword results.
# ===========================================================================
ai:
  enabled: true
  provider: gemini
  # Models to try, in order (blank = good free defaults for the provider).
  # These score the day's jobs, so they should be fast.
  models: []
  # Stronger models for the hard tasks – the career coach (resume analysis,
  # portfolio projects, tailoring tips). Blank = the provider's best free ones
  # (Gemini: gemini-pro-latest first, then the best Flash if Pro isn't free on
  # your key). The report on the dashboard names the model that answered.
  smart_models: []
  profile: |
    Electrical & Electronic Engineering (EEE) degree holder (BSc) in Sri Lanka
    looking for degree-level engineering jobs in power, electronics, automation, telecom and related
    fields. Prefer engineer / trainee-engineer roles over diploma-level
    (technical officer, HND/NDT), technician, sales or admin roles. Open to internships and entry- to mid-level positions.
  min_score: 4
  batch_size: 20 # jobs per AI request
  requests_per_minute: 8 # stay under the free-tier limit

  # "Helpers": judgment calls keywords can't make. Each is one batched request whose answers are remembered
  # (data/ai_decisions.json), so a day needs only a handful. They stop for the day at `daily_budget` requests
  # (Gemini's free tier is small – keep this modest); without a key or budget the plain rules apply.
  #   * triage     – unmatched jobs with generic titles ("Technical Officer", "Project Engineer") are shown to the AI,
  #                  which picks the ones an EEE graduate would apply for; the ones it turns down aren't opened (OCR).
  #   * remote     – each new remote job's advert is read: open to someone in Sri Lanka? fully remote?
  #   * alerts     – job-alert e-mails in a layout jobot doesn't know.
  helpers: true
  daily_budget: 30   # AI requests per day for all helpers together
  triage_batch: 60   # job titles per triage request
  triage_calls: 3    # most triage requests in one run
  vet_batch: 25      # remote jobs per eligibility request
  alert_calls: 4     # most unknown alert e-mails read in one run

# ===========================================================================
#  7. CAREER COACH (optional, free – needs the AI key and your resume)
#  Upload your resume on the dashboard's Coach tab (it is stored encrypted).
#  Once a week jobot then reads it against the adverts it has collected and
#  writes a report: how the resume reads, the skills employers ask for that it
#  doesn't show, portfolio projects that would close those gaps, and how well
#  each open job fits your resume. You can also press "Analyse" on the Coach
#  tab at any time.
#  Privacy: your name, e-mail, phone number and links are removed before any
#  text is sent to the AI. Google's free Gemini tier may use what it receives
#  to improve its products – set `send_resume: false` (or use another provider)
#  if you don't want your resume's content to leave GitHub.
# ===========================================================================
coach:
  enabled: true
  # When the report is refreshed automatically: monday … sunday, daily, or off.
  weekly_report: sunday
  # How many days of adverts the skill-demand numbers cover.
  window_days: 90
  # How many portfolio project ideas to suggest.
  projects: 4
  # Skills of your own to look for in adverts and in your resume.
  extra_skills: []
  # false = the resume text is never sent to the AI; you still get skill
  # demand, gaps and per-job resume matching (those are computed here).
  send_resume: true

# ===========================================================================
#  8. NOTIFICATIONS
#  Channels turn on automatically when their secrets are set
#  (see README: TELEGRAM_BOT_TOKEN + TELEGRAM_CHAT_ID, and/or SMTP_* + EMAIL_TO).
# ===========================================================================
notify:
  # Send a short "no new jobs today" message so you know the bot ran.
  send_when_empty: true
  # Forget a vacancy after this many days (a re-post after that is re-sent).
  remember_days: 60
  # How jobs are arranged in each message.
  #   order_by: best_match | newest | closing_soon | company | title
  #     (best_match = highest AI score first, then newest)
  #   group_by: level | subfield | site | none
  order_by: best_match
  group_by: level
  # A "Your week" summary (new jobs, busiest sub-fields and sites, top
  # employers) and up to 3 suggestions, added on this day: monday … sunday,
  # daily, or off. Statistics and every new job are saved every run, encrypted
  # with your DASHBOARD_PASSWORD secret, for the settings page's dashboard.
  weekly_summary: monday
  # Jobs the AI scores at least this high are listed as "Top picks" at the
  # top of the message (0 = off).
  top_picks_score: 8
