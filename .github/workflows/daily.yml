name: Daily EEE job hunt

on:
  schedule:
    # Every 30 minutes (at :13 and :43, away from the busy top of the hour). GitHub may start
    # scheduled runs late when it is busy, and each run reads every open listing, so a late
    # run loses nothing. The first run after `schedule.digest_hour` (config.yaml) sends the
    # daily summary; the runs in between only message you when they find new jobs.
    - cron: "13,43 * * * *"
  workflow_dispatch:
    inputs:
      subfields:
        description: "Only these sub-fields, comma-separated (blank = use config.yaml). e.g. power,electronics"
        required: false
        default: ""
      levels:
        description: "Only these experience levels, comma-separated (blank = use config.yaml). e.g. internship,entry"
        required: false
        default: ""
      resend_all:
        description: "Send every currently open matching job, not just new ones"
        type: boolean
        default: false
      qualifications:
        description: "Only these qualifications, comma-separated (blank = use config.yaml). e.g. degree,diploma"
        required: false
        default: ""
      career:
        description: "Only refresh the career report (resume analysis, skill gaps, project ideas) - no jobs are fetched or sent"
        type: boolean
        default: false
      prepare:
        description: "Only prepare for one job: its id (shown on the dashboard) - cover letter, bullets, interview questions, study plan"
        required: false
        default: ""
      auto:
        description: "Behave like a scheduled run: the first run after the digest hour sends the daily summary, the ones in between only message you about new jobs"
        type: boolean
        default: false
      probe:
        description: "Only try the sites listed in candidates.txt from GitHub's servers and print which ones work - nothing is fetched for jobs or sent"
        type: boolean
        default: false
      probe_file:
        description: "With probe: the list of addresses to try (default candidates.txt)"
        required: false
        default: "candidates.txt"
      dry_run:
        description: "Only print results in the log; don't notify or remember"
        type: boolean
        default: false

permissions:
  contents: write  # to commit data/ (sent jobs, statistics, adverts already read)

concurrency:
  group: jobot
  cancel-in-progress: false

jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      # Free tools for reading adverts that are poster images (Tesseract OCR) or PDFs.
      - name: Install OCR tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends tesseract-ocr tesseract-ocr-eng poppler-utils

      - name: Find jobs and notify
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_BASE_URL: ${{ secrets.AI_BASE_URL }}
          # Optional extra channels (see README): job-alert e-mails read from your mailbox, and Jooble's API.
          IMAP_USERNAME: ${{ secrets.IMAP_USERNAME }}
          IMAP_PASSWORD: ${{ secrets.IMAP_PASSWORD }}
          JOOBLE_API_KEY: ${{ secrets.JOOBLE_API_KEY }}
          # Encrypts the job history and statistics saved in data/history/ (see README).
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
          # Manual-run inputs go through env vars, never straight into the script.
          IN_SUBFIELDS: ${{ inputs.subfields }}
          IN_LEVELS: ${{ inputs.levels }}
          IN_QUALIFICATIONS: ${{ inputs.qualifications }}
          IN_RESEND_ALL: ${{ inputs.resend_all }}
          IN_CAREER: ${{ inputs.career }}
          IN_PREPARE: ${{ inputs.prepare }}
          IN_DRY_RUN: ${{ inputs.dry_run }}
          IN_AUTO: ${{ inputs.auto }}
          IN_PROBE: ${{ inputs.probe }}
          IN_PROBE_FILE: ${{ inputs.probe_file }}
          EVENT: ${{ github.event_name }}
        run: |
          args=()
          [ -n "$IN_SUBFIELDS" ] && args+=(--subfields "$IN_SUBFIELDS")
          [ -n "$IN_LEVELS" ] && args+=(--levels "$IN_LEVELS")
          [ -n "$IN_QUALIFICATIONS" ] && args+=(--qualifications "$IN_QUALIFICATIONS")
          [ "$IN_RESEND_ALL" = "true" ] && args+=(--all)
          [ "$IN_CAREER" = "true" ] && args+=(--career)
          [ -n "$IN_PREPARE" ] && args+=(--prepare "$IN_PREPARE")
          [ "$IN_DRY_RUN" = "true" ] && args+=(--dry-run)
          [ "$IN_PROBE" = "true" ] && args+=(--probe "${IN_PROBE_FILE:-candidates.txt}")
          [ "$EVENT" = "schedule" ] || [ "$IN_AUTO" = "true" ] && args+=(--auto)
          python -m jobot "${args[@]}"

      - name: Remember sent jobs
        if: always()
        run: |
          if [ -n "$(git status --porcelain -- data/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/
            git commit -m "Update seen jobs [skip ci]"
            git pull --rebase
            git push
          fi
